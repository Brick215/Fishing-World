<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173f48">
<meta name="description" content="Fishing World – ein gemütliches Angelabenteuer">
<link rel="manifest" href="manifest.webmanifest">
<title>Fishing World</title>
<style>
:root{--ink:#183b40;--muted:#668084;--sea:#b8e2dc;--deep:#173f48;--cream:#fff8e8;--gold:#e9b95d;--green:#5e987b;--line:#d8e5dc;--shadow:0 12px 35px #173f4820}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#d7eee3,#b8d9d5 55%,#a7c9ca);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:11px 15px;background:var(--deep);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e8f0e9;color:var(--ink);border:1px solid var(--line)}button.gold{background:var(--gold);color:#3d3424}button:disabled{opacity:.45}.app{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#ffffffd9;border:1px solid white;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}.brand{font-weight:900;font-size:21px;letter-spacing:.2px}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#edf5ed;border-radius:99px;padding:7px 11px;font-weight:800;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:14px;margin-top:14px}.scene,.panel{background:#fffaf0eF;border:1px solid #fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.sceneHead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px}.sceneHead h2{margin:0;font-size:20px}.world{height:390px;position:relative;overflow:hidden;background:linear-gradient(#a7d8d1 0 46%,#4c9a9a 47% 100%)}.world:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 65%,#a8d9c5 0 15%,transparent 16%),linear-gradient(125deg,transparent 0 30%,#d6e8be 30% 33%,transparent 33%),linear-gradient(35deg,transparent 0 70%,#d9e9c5 70% 73%,transparent 73%)}.sun{position:absolute;right:9%;top:9%;width:55px;height:55px;border-radius:50%;background:#ffe5a0;box-shadow:0 0 40px #ffe5a0aa}.tree{position:absolute;bottom:43%;width:62px;height:105px;background:linear-gradient(90deg,#815f46,#a57b52);clip-path:polygon(42% 100%,48% 40%,10% 40%,50% 0,90% 40%,58% 40%,60% 100%)}.tree:after{content:"";position:absolute;inset:0;background:#5d9270;clip-path:polygon(50% 0,100% 48%,75% 48%,95% 75%,5% 75%,25% 48%,0 48%)}.tree.t1{left:8%;transform:scale(1.1)}.tree.t2{right:10%;transform:scale(.9)}.dock{position:absolute;bottom:35%;left:42%;width:120px;height:14px;background:#986e4c;transform:rotate(-5deg);border-radius:5px}.angler{position:absolute;bottom:39%;left:48%;font-size:42px;filter:drop-shadow(0 4px 2px #2448)}.waterline{position:absolute;top:47%;height:3px;width:100%;background:#d4f0df88}.ripples{position:absolute;bottom:17%;left:57%;width:65px;height:20px;border:2px solid #d8f4e9;border-radius:50%;opacity:.7}.sceneFoot{padding:14px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hint{color:var(--muted);font-size:13px;flex:1;min-width:180px}.panel{padding:16px}.panel h3{margin:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tabs button{padding:9px 5px;font-size:12px}.tabs button.active{background:var(--gold);color:#3d3424}.content{min-height:250px}.card{background:#f1f6ec;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:var(--muted)}.bar{height:9px;background:#dbe7dc;border-radius:99px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.fishgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.fish{padding:9px;border-radius:12px;background:#f0f5eb;font-size:12px}.modal{position:fixed;inset:0;background:#102e33a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.dialog{width:min(500px,100%);background:var(--cream);border-radius:22px;padding:20px;box-shadow:0 20px 70px #0005;max-height:90vh;overflow:auto}.dialog h2{margin:0 0 8px}.minigame{height:26px;background:#d9e4d9;border-radius:99px;position:relative;margin:20px 0;overflow:hidden}.target{position:absolute;left:37%;width:28%;height:100%;background:#9bd0a5}.marker{position:absolute;left:0;top:0;width:5px;height:100%;background:#17454a}.actions{display:flex;gap:8px;flex-wrap:wrap}.listitem{padding:10px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}footer{text-align:center;color:#507174;font-size:11px;padding:18px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.world{height:330px}.app{padding:9px}.panel{padding:13px}.brand{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">🎣 Fishing World</div><div class="small" id="regionLabel">Silberquell · Der Waldsee</div></div><div class="stats"><span class="pill" id="level">Level 1 · 0 XP</span><span class="pill" id="coins">🪙 80</span><span class="pill" id="bag">🎒 0 Fische</span></div></header>
<div class="layout">
<section class="scene"><div class="sceneHead"><h2 id="spotName">Uferlichtung</h2><span class="pill" id="weather">☀️ Sonnig</span></div>
<div class="world" id="world"><div class="sun"></div><div class="tree t1"></div><div class="tree t2"></div><div class="waterline"></div><div class="dock"></div><div class="angler">🧍</div><div class="ripples"></div></div>
<div class="sceneFoot"><button id="castBtn" class="gold">🎣 Auswerfen</button><button class="secondary" id="travelBtn">🗺️ Weltkarte</button><span class="hint" id="hint">Am Waldsee ist es ruhig. Vielleicht beißt gleich etwas.</span></div></section>
<aside class="panel"><h3>Dein Abenteuer</h3><div class="tabs" id="tabs"><button class="active" data-tab="home">Übersicht</button><button data-tab="inventory">Inventar</button><button data-tab="fishbook">Fischbuch</button><button data-tab="map">Weltkarte</button><button data-tab="quests">Quests</button><button data-tab="more">Mehr</button></div><div class="content" id="content"></div></aside>
</div><footer>Fishing World · Dein ruhiges Angelabenteuer · Spielstand wird automatisch auf diesem Gerät gespeichert</footer>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
(()=>{
const regions=[
{name:"Silberquell",sub:"Der Waldsee",spots:["Uferlichtung","Schilfbucht","Alter Steg","Mooswasser","Mühlenwehr"],emoji:"🌲",unlock:1},
{name:"Korallenbucht",sub:"Die Tropenküste",spots:["Palmenstrand","Korallenriff","Lagunenbogen","Muschelhafen","Sonnenklippe"],emoji:"🏝️",unlock:5},
{name:"Frostspiegel",sub:"Die Gebirgswelt",spots:["Eisiger See","Schneefallufer","Gletscherarm","Bergquelle","Frostgrotte"],emoji:"🏔️",unlock:12},
{name:"Kristallhöhlen",sub:"Die Unterwelt",spots:["Tropfsteingrotte","Leuchtsee","Kristallrinne","Tiefenbecken","Hallenkammer"],emoji:"💎",unlock:22},
{name:"Sternensee",sub:"Das magische Land",spots:["Sternenstrand","Mondbucht","Nebelgarten","Himmelssteg","Lichtwasser"],emoji:"✨",unlock:35}
];
const roots=["Rotfeder","Silberling","Barsch","Karpfen","Schleie","Aland","Döbel","Hecht","Forelle","Aal","Karausche","Ukelei","Nase","Barbe","Wels","Renke","Saibling","Stör","Güster","Quappe","Sonnenfisch","Bitterling","Gründling","Rapfen","Zander","Flusskrebs","Mondfisch","Glasflosser"];
const rarity=["Gewöhnlich","Ungewöhnlich","Selten","Episch","Legendär","Geheimnisvoll"];
const fish=[];
regions.forEach((r,ri)=>roots.forEach((n,i)=>fish.push({id:ri*28+i,name:(ri===0?n:n+" "+["der Lagune","des Frosts","der Tiefe","der Sterne"][ri-1]),region:ri,rarity: i<14?"Gewöhnlich":i<21?"Ungewöhnlich":i<25?"Selten":i<27?"Episch":"Legendär",value:5+i*2+ri*3,weight:0.2+(i%9)*0.35})));
fish[139].rarity="Geheimnisvoll";fish[139].name="Sternenwächter";
const $=id=>document.getElementById(id);
const fresh=()=>({player:"Angler",level:1,xp:0,coins:80,region:0,spot:0,inventory:[],caught:[],released:0,sold:0,casts:0,largest:0,quests:[false,false,false,false],achievements:[],rod:1,boat:0,baits:5,restaurant:[],deliveries:[],settings:{sound:true},backups:[]});
let s;try{s=JSON.parse(localStorage.getItem("fw_save_v1")||"null")||fresh()}catch(e){s=fresh()}
function save(){localStorage.setItem("fw_save_v1",JSON.stringify(s));renderHeader()}
function xp(n){s.xp+=n;while(s.xp>=s.level*100&&s.level<100){s.xp-=s.level*100;s.level++;s.coins+=15}if(s.level>=100){s.coins+=Math.floor(s.xp/100)*10;s.xp%=100}save()}
function renderHeader(){ $("level").textContent=`Level ${s.level} · ${s.xp} XP`;$("coins").textContent=`🪙 ${s.coins}`;$("bag").textContent=`🎒 ${s.inventory.length} Fische`;$("regionLabel").textContent=regions[s.region].name+" · "+regions[s.region].sub;$("spotName").textContent=regions[s.region].spots[s.spot];}
function show(html){$("dialog").innerHTML=html;$("modal").classList.add("show")}
function close(){$("modal").classList.remove("show")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))close()});
function renderHome(){$("content").innerHTML=`<div class="card"><b>Willkommen, ${s.player}!</b><p class="small">Dein nächstes Abenteuer wartet am Wasser. Wirf deine Angel aus, entdecke neue Arten und verbessere deine Ausrüstung.</p><div class="bar"><i style="width:${Math.min(100,s.xp/(s.level*100)*100)}%"></i></div><span class="small">${s.xp} / ${s.level*100} XP bis Level ${s.level+1}</span></div><div class="row"><span>Entdeckte Fischarten</span><b>${s.caught.length} / 140</b></div><div class="row"><span>Angelwürfe</span><b>${s.casts}</b></div><div class="row"><span>Größter Fang</span><b>${s.largest?s.largest.toFixed(1)+" cm":"Noch keiner"}</b></div><div class="card"><b>Dein aktuelles Ziel</b><p class="small">Fange 3 Fische am Waldsee und sammle Münzen für deine erste Ausrüstungsverbesserung.</p></div>`}
function renderInventory(){$("content").innerHTML=`<div class="row"><b>Fischinventar</b><span class="small">${s.inventory.length} Fische</span></div>`+(s.inventory.length?s.inventory.map((f,i)=>`<div class="listitem"><div class="row"><b>🐟 ${f.name}</b><b>${f.value} 🪙</b></div><div class="small">${f.rarity} · ${f.length.toFixed(1)} cm · ${f.weight.toFixed(2)} kg</div><div class="actions" style="margin-top:7px"><button onclick="FW.sell(${i})">Verkaufen</button><button class="secondary" onclick="FW.keep(${i})">Behalten</button></div></div>`).join(""):`<p class="small">Dein Korb ist noch leer. Zeit für einen Angelausflug!</p>`)+`<div class="actions" style="margin-top:12px"><button class="gold" onclick="FW.sellAll()">Alle Fische verkaufen</button></div>`}
function renderFishbook(){let discovered=new Set(s.caught);$("content").innerHTML=`<b>Fischbuch · ${discovered.size}/140 entdeckt</b><p class="small">Unbekannte Arten bleiben als Silhouette verborgen.</p><div class="fishgrid">${fish.map(f=>`<div class="fish">${discovered.has(f.id)?"🐟":"⬛"} <b>${discovered.has(f.id)?f.name:"???"}</b><div class="small">${regions[f.region].name} · ${discovered.has(f.id)?f.rarity:"Unbekannt"}</div></div>`).join("")}</div>`}
function renderMap(){$("content").innerHTML=`<b>Weltkarte</b><p class="small">Neue Regionen werden mit deinem Level erreichbar.</p>`+regions.map((r,i)=>`<div class="card"><div class="row"><b>${r.emoji} ${r.name}</b><span class="small">${s.level>=r.unlock?"Freigeschaltet":"Ab Level "+r.unlock}</span></div><div class="small">${r.sub} · ${r.spots.length} Angelstellen</div><div class="actions" style="margin-top:8px">${s.level>=r.unlock?`<button onclick="FW.travel(${i})">${i===s.region?"Aktuelle Region":"Reisen"}</button>`:"🔒 Gesperrt"}</div></div>`).join("")+`<div class="small">Angelstellen in deiner Region:</div><div class="actions">${regions[s.region].spots.map((p,i)=>`<button class="secondary" onclick="FW.spot(${i})">${p}</button>`).join("")}</div>`}
function renderQuests(){$("content").innerHTML=`<b>Aufgaben</b><div class="card"><b>🌱 Erste Schritte</b><p class="small">Wirf deine Angel dreimal aus. Fortschritt: ${Math.min(3,s.casts)}/3</p><div class="bar"><i style="width:${Math.min(100,s.casts/3*100)}%"></i></div></div><div class="card"><b>🐟 Kleine Sammlung</b><p class="small">Entdecke fünf Fischarten. Fortschritt: ${Math.min(5,s.caught.length)}/5</p><div class="bar"><i style="width:${Math.min(100,s.caught.length/5*100)}%"></i></div></div><div class="card"><b>🪙 Händlerbesuch</b><p class="small">Verkaufe deinen ersten Fisch. ${s.sold?"Abgeschlossen":"Noch offen"}</p></div><div class="card"><b>🧭 Neue Horizonte</b><p class="small">Erreiche Level 5, um die Korallenbucht zu besuchen.</p></div>`}
function renderMore(){$("content").innerHTML=`<div class="card"><b>🛒 Händler & Ausrüstung</b><p class="small">Angelrute Stufe ${s.rod}. Nächste Verbesserung kostet ${s.rod*55} Münzen.</p><button onclick="FW.upgrade()">Angelrute verbessern</button></div><div class="card"><b>🍲 Restaurant</b><p class="small">Verarbeite Fische zu Gerichten und verkaufe sie mit Gewinn.</p><button onclick="FW.restaurant()">Restaurant öffnen</button></div><div class="card"><b>🏆 Erfolge & Statistiken</b><p class="small">${s.achievements.length} Erfolge · ${s.casts} Würfe · ${s.sold} verkaufte Fische</p><button class="secondary" onclick="FW.achievements()">Erfolge ansehen</button></div><div class="card"><b>💾 Spielstand</b><p class="small">Autospeicherung auf diesem Gerät. Exportiere regelmäßig eine Sicherung.</p><div class="actions"><button class="secondary" onclick="FW.export()">Exportieren</button><button class="secondary" onclick="FW.import()">Importieren</button><button class="secondary" onclick="FW.reset()">Neues Spiel</button></div></div><div class="card"><b>Profil</b><input id="playerName" value="${s.player}" maxlength="18" style="padding:9px;border:1px solid #ccd9ce;border-radius:10px;width:100%;margin:8px 0"><button onclick="FW.rename()">Namen speichern</button></div>`}
function render(tab="home"){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({home:renderHome,inventory:renderInventory,fishbook:renderFishbook,map:renderMap,quests:renderQuests,more:renderMore}[tab]||renderHome)()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>render(b.dataset.tab));
function fishCatch(){let pool=fish.filter(f=>f.region===s.region);let f=pool[Math.floor(Math.random()*pool.length)];let length=12+Math.random()*65+s.rod*1.8,weight=f.weight*(.5+Math.random()*2);let item={...f,length,weight,value:Math.round(f.value*(.7+length/70)*(1+f.rarity==="Legendär"?.5:0))};item.value=Math.max(3,Math.round(f.value*(.7+length/70)*(f.rarity==="Legendär"?2.2:f.rarity==="Episch"?1.6:1)));return item}
function cast(){s.casts++;save();let f=fishCatch();show(`<h2>Ein Biss! 🫧</h2><p>Etwas hat angebissen. Halte den Knopf gedrückt, wenn der Marker im grünen Bereich ist.</p><div class="minigame"><div class="target"></div><div class="marker" id="marker"></div></div><div class="actions"><button id="reel" class="gold" style="flex:1">Gedrückt halten: Einholen</button><button class="secondary" id="escape">Aufgeben</button></div><p class="small" id="progress">0 %</p>`);let marker=0,dir=1,progress=0,holding=false,done=false;let bar=$("marker"),p=$("progress"),btn=$("reel");let timer=setInterval(()=>{if(done)return;marker+=dir*1.4;if(marker>94||marker<0)dir*=-1;bar.style.left=marker+"%";if(holding&&marker>37&&marker<65)progress+=2.4;else progress=Math.max(0,progress-.55);p.textContent=Math.floor(progress)+" %";if(progress>=100){done=true;clearInterval(timer);catchResult(f)}},45);btn.onpointerdown=()=>{holding=true};btn.onpointerup=btn.onpointerleave=()=>{holding=false};$("escape").onclick=()=>{done=true;clearInterval(timer);close();$("hint").textContent="Der Fisch ist entkommen. Beim nächsten Mal klappt es vielleicht."};}
function catchResult(f){s.inventory.push(f);if(!s.caught.includes(f.id))s.caught.push(f.id);s.largest=Math.max(s.largest,f.length);xp(18+Math.floor(f.value/3));save();show(`<h2>Gefangen! 🐟</h2><div class="card"><b>${f.name}</b><p>${f.rarity} · ${f.length.toFixed(1)} cm · ${f.weight.toFixed(2)} kg</p><b>Wert: ${f.value} Münzen</b></div><p>Was möchtest du mit deinem Fang machen?</p><div class="actions"><button class="gold" id="sellCaught">Verkaufen</button><button class="secondary" id="keepCaught">Behalten</button><button class="secondary" id="releaseCaught">Freilassen</button></div>`);$("sellCaught").onclick=()=>{s.inventory.pop();s.coins+=f.value;s.sold++;save();close();render("inventory")};$("keepCaught").onclick=()=>{close();render("inventory")};$("releaseCaught").onclick=()=>{s.inventory.pop();s.released++;save();close();$("hint").textContent="Der Fisch schwimmt wieder davon. Deine Entdeckung bleibt im Fischbuch.";};}
const FW=window.FW={sell(i){let f=s.inventory.splice(i,1)[0];s.coins+=f.value;s.sold++;save();render("inventory")},keep(){alert("Der Fisch bleibt in deinem Inventar.")},sellAll(){let total=s.inventory.reduce((a,f)=>a+f.value,0);s.sold+=s.inventory.length;s.inventory=[];s.coins+=total;save();render("inventory")},travel(i){if(s.level<regions[i].unlock)return;s.region=i;s.spot=0;save();close();$("hint").textContent="Du bist in "+regions[i].name+" angekommen.";render("map")},spot(i){s.spot=i;save();$("hint").textContent="Du angelst jetzt bei "+regions[s.region].spots[i]+".";renderHeader()},upgrade(){let cost=s.rod*55;if(s.rod>=6){alert("Deine Angelrute ist bereits auf der höchsten Stufe.");return}if(s.coins<cost){alert("Dafür fehlen dir noch Münzen.");return}s.coins-=cost;s.rod++;save();render("more")},restaurant(){let possible=s.inventory.length;show(`<h2>🍲 Restaurant</h2><p>Gib Fische in die Küche. Ein Gericht bringt einen kleinen Verkaufsbonus.</p><p>Fische im Inventar: ${possible}</p><button id="cook" ${possible<1?"disabled":""}>Ein Gericht zubereiten (1 Fisch)</button> <button class="secondary" onclick="FW.deliver()">Lieferungen</button>`);$("cook").onclick=()=>{let f=s.inventory.shift();let earnings=Math.round(f.value*1.45);s.coins+=earnings;save();show(`<h2>Gut gelungen! 🍲</h2><p>Dein Gericht wurde verkauft. Du erhältst ${earnings} Münzen.</p><button onclick="document.getElementById('modal').classList.remove('show');FW.render('more')">Weiter</button>`) }},deliver(){alert("Es sind aktuell keine offenen Lieferungen vorhanden.")},achievements(){show(`<h2>🏆 Erfolge</h2><div class="card">Erster Wurf · Wirf deine Angel einmal aus. ${s.casts>0?"✓":"○"}</div><div class="card">Sammler · Entdecke 10 Fischarten. ${s.caught.length>=10?"✓":"○"}</div><div class="card">Händler · Verkaufe 10 Fische. ${s.sold>=10?"✓":"○"}</div><div class="card">Reisender · Erreiche Level 5. ${s.level>=5?"✓":"○"}</div><button onclick="FW.close()">Schließen</button>`)},export(){let blob=new Blob([JSON.stringify(s)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="FishingWorld-Spielstand.json";a.click();URL.revokeObjectURL(a.href)},import(){let input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.level||!Array.isArray(d.inventory))throw 0;s=d;save();render();alert("Spielstand importiert.")}catch(e){alert("Diese Sicherungsdatei ist ungültig.")}};r.readAsText(input.files[0])};input.click()},reset(){if(confirm("Neues Spiel starten? Exportiere vorher deinen Spielstand, wenn du ihn behalten möchtest.")){s=fresh();save();render()}},rename(){let v=$("playerName").value.trim();if(v){s.player=v;save();render("more")}},render,close};
$("castBtn").onclick=cast;$("travelBtn").onclick=()=>render("map");renderHeader();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
})();
</script>
</body></html>
